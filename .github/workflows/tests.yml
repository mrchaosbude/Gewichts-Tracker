name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest
      - name: Tests ausführen
        env:
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: python -m pytest -q --deselect tests/test_selenium_workflow.py
